<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Freelance Teaching Life — 2-Minute Survey</title>
<meta name="description" content="A 2-minute survey for freelance tutors, instructors and coaches. What actually eats your time?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F8F5;
    --line:#DDE3DA;         /* ruled-paper lines */
    --margin:#E8B4B4;       /* the red margin line of an exercise book */
    --ink:#1E2B33;
    --ink-soft:#5B6B72;
    --hilite:#FFE066;       /* highlighter yellow */
    --marker:#0E7C66;       /* teal marker pen — CTA */
    --marker-deep:#0A5F4F;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    background:
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px),
      var(--paper);
    color:var(--ink);
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    line-height:1.55;
  }
  /* red margin line, like an exercise book */
  body::before{
    content:"";position:fixed;top:0;bottom:0;left:22px;width:2px;
    background:var(--margin);opacity:.55;pointer-events:none;
  }
  .wrap{width:100%;max-width:560px;padding:20px 20px 48px;flex:1;display:flex;flex-direction:column}
  header{padding:10px 0 4px}
  .brand{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;
    letter-spacing:.04em;color:var(--ink-soft);text-transform:uppercase;
  }
  .progress{margin:14px 0 18px}
  .progress .label{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  .bar{height:6px;background:#E7EAE4;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0%;background:var(--marker);border-radius:99px;transition:width .35s ease}

  .card{
    background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);
    box-shadow:4px 4px 0 rgba(30,43,51,.12);
    padding:26px 22px;animation:slideIn .3s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .card{animation:none}
    .bar > i{transition:none}
  }

  h1,h2{font-family:"Bricolage Grotesque",sans-serif;line-height:1.15}
  h1{font-size:clamp(28px,7vw,38px);font-weight:800;margin-bottom:12px}
  h2{font-size:clamp(21px,5.5vw,26px);font-weight:700;margin-bottom:6px}
  .hint{color:var(--ink-soft);font-size:14.5px;margin-bottom:18px}
  .intro p{margin-bottom:12px}

  /* highlighter swipe = the signature */
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 14px;margin-bottom:10px;
    background:transparent;border:1.5px solid var(--ink);border-radius:10px;
    font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer;
    position:relative;overflow:hidden;transition:transform .06s ease;
  }
  .opt:active{transform:scale(.985)}
  .opt::before{
    content:"";position:absolute;inset:4px;border-radius:6px;
    background:linear-gradient(100deg, var(--hilite) 0%, #FFEB99 100%);
    transform:scaleX(0);transform-origin:left center;transition:transform .22s ease;
    z-index:0;
  }
  @media (prefers-reduced-motion: reduce){ .opt::before{transition:none} }
  .opt.on::before{transform:scaleX(1)}
  .opt > *{position:relative;z-index:1}
  .opt .tick{
    width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--ink);border-radius:6px;
    display:grid;place-items:center;font-size:14px;font-weight:700;background:#fff;
  }
  .opt.on .tick::after{content:"✓"}
  .opt.radio .tick{border-radius:50%}
  .opt:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

  textarea,input[type=text]{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    padding:12px 14px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;
  }
  textarea{min-height:96px;resize:vertical}
  textarea:focus-visible,input:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}

  .nav{display:flex;gap:10px;margin-top:20px}
  .btn{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;
    padding:13px 22px;border-radius:10px;cursor:pointer;border:1.5px solid var(--ink);
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
  .btn.primary{background:var(--marker);border-color:var(--marker-deep);color:#fff;flex:1}
  .btn.primary:hover{background:var(--marker-deep)}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .fine{font-size:13px;color:var(--ink-soft);margin-top:12px}
  .reveal{
    background:linear-gradient(100deg,var(--hilite),#FFEB99);
    border-radius:8px;padding:3px 8px;display:inline;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:600;
  }
  .thanks h1{margin-bottom:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">The Freelance Teaching Life</div></header>

  <div class="progress" id="progress" aria-hidden="true">
    <div class="label" id="progLabel"></div>
    <div class="bar"><i id="progFill"></i></div>
  </div>

  <main id="stage" aria-live="polite"></main>
</div>

<script>
/* ================= CONFIG — EDIT THESE ================= */
// From Supabase dashboard → Project Settings → API
// e.g. "https://abcdefgh.supabase.co"  (no trailing slash)
const SUPABASE_URL = "";
// The "anon / public" key (safe to expose ONLY because the table's RLS
// policy is insert-only — the public can add rows, never read them)
const SUPABASE_ANON_KEY = "";
// Optional fallback if Supabase is unreachable: prefilled WhatsApp message
// to you. International format, digits only, e.g. "6591234567". Leave "" to skip.
const WHATSAPP_NUMBER = "";
// Link to your product guide PDF (host it in the same repo, e.g. "guide.pdf",
// or a full https URL). The thank-you screen buttons link here.
const PDF_URL = "guide.pdf";
/* ======================================================= */

const answers = {};
let stepIndex = 0;

const steps = [
  { id:"intro", type:"intro" },
  { id:"role", type:"single", q:"What do you teach or coach?",
    hint:"Tap one.",
    opts:["Academic tuition","Music, art or enrichment","Sports or fitness","Language","Professional / skills training","Something else"] },
  { id:"count", type:"single", q:"How many students or clients right now?",
    hint:"Rough number is fine.",
    opts:["1–5","6–15","16–30","More than 30"] },
  { id:"chores", type:"multi", q:"Where does your admin time actually go?",
    hint:"Tick everything that eats your week.",
    opts:["Chasing or tracking payments","Scheduling and rescheduling lessons","Reminding students about lessons","Tracking progress or homework","Making invoices or receipts","Finding new students","Honestly, not much admin"] },
  { id:"tracking", type:"single", q:"How do you keep track of who has paid?",
    hint:"Be honest — no judgment here.",
    opts:["It's all in my head","Notebook or paper","Spreadsheet (Excel / Google Sheets)","I scroll my bank app to check","An app made for this","Someone else handles it"] },
  { id:"lost", type:"single", q:"Ever lost money from late or forgotten payments?",
    hint:"Late, under-collected, or never collected.",
    opts:["Never — everyone pays on time","Rarely, small amounts","A few times a year","More often than I'd like to admit"] },
  { id:"one_wish", type:"single", q:"If an app could take ONE chore off your plate forever, which one?",
    hint:"Only one — the one you'd miss least.",
    opts:["Chasing and tracking payments","Scheduling lessons","Sending lesson reminders","Tracking student progress","Invoices and receipts","Marketing myself"] },
  { id:"open", type:"text", q:"Anything else that would make your teaching life easier?",
    hint:"Optional — one line or a whole rant, both welcome." },
  { id:"pitch", type:"pitch" },
  { id:"contact", type:"contact" },
  { id:"done", type:"done" }
];

const askable = steps.filter(s => !["intro","done"].includes(s.type)).length;

function render(){
  const s = steps[stepIndex];
  const stage = document.getElementById("stage");
  const prog = document.getElementById("progress");

  // progress
  const qNum = steps.slice(0, stepIndex).filter(x => !["intro","done"].includes(x.type)).length;
  if (s.type === "intro" || s.type === "done"){ prog.style.visibility = "hidden"; }
  else {
    prog.style.visibility = "visible";
    document.getElementById("progLabel").textContent = "Question " + (qNum+1) + " of " + askable;
    document.getElementById("progFill").style.width = ((qNum) / askable * 100) + "%";
  }

  let html = '<div class="card">';

  if (s.type === "intro"){
    html += `
      <div class="intro">
        <h1>Teaching is your passion. Keep it that way.</h1>
        <p><strong>Chasing payments. Juggling schedules. Rewriting reminder texts so they don't sound rude.</strong></p>
        <p>Sound familiar? <span class="reveal">Tell me your biggest struggle</span> — I'm Fahmy, and I build tools to fix exactly this.</p>
        <p class="hint">8 quick taps, about 2 minutes. Answers go straight to me — nothing to sign up for.</p>
        <div class="nav"><button class="btn primary" onclick="next()">Start</button></div>
      </div>`;
  }

  if (s.type === "single" || s.type === "multi"){
    html += `<h2>${s.q}</h2><p class="hint">${s.hint}</p>`;
    s.opts.forEach((o,i)=>{
      const sel = s.type==="multi"
        ? (answers[s.id]||[]).includes(o)
        : answers[s.id]===o;
      html += `<button class="opt ${s.type==="single"?"radio":""} ${sel?"on":""}" data-i="${i}" onclick="pick('${s.id}','${s.type}',${i})">
        <span class="tick" aria-hidden="true"></span><span>${o}</span></button>`;
    });
    html += navButtons(s.type==="multi" ? !(answers[s.id]||[]).length : !answers[s.id]);
  }

  if (s.type === "text"){
    html += `<h2>${s.q}</h2><p class="hint">${s.hint}</p>
      <textarea id="freeText" placeholder="Type here…">${answers[s.id]||""}</textarea>`;
    html += navButtons(false, true);
  }

  if (s.type === "pitch"){
    html += `
      <h2>One last thing — the reason I'm asking.</h2>
      <p style="margin-bottom:12px">I'm building an app for freelance tutors and coaches that
      <span class="reveal">tracks every student's payments and lessons</span> — and sends the
      reminders for you, so you never have to chase anyone again.</p>
      <p class="hint">Survey respondents get it <strong>free for 3 months</strong>. After that it's <strong>S$10/month</strong> (or S$60/year). Honestly — where do you stand?</p>
      <button class="opt radio ${answers.interest==="yes"?"on":""}" onclick="pick('interest','single',0,'yes')"><span class="tick"></span><span>Worth S$10/mth to me — sign me up</span></button>
      <button class="opt radio ${answers.interest==="maybe"?"on":""}" onclick="pick('interest','single',1,'maybe')"><span class="tick"></span><span>I'd try the 3 free months, then decide</span></button>
      <button class="opt radio ${answers.interest==="no"?"on":""}" onclick="pick('interest','single',2,'no')"><span class="tick"></span><span>Only if it were free — not for me</span></button>
      ${navButtons(!answers.interest)}`;
  }

  if (s.type === "contact"){
    const noPath = answers.interest === "no";
    html += `
      <h2>${noPath ? "One last tap." : "You're on the list."}</h2>
      <p class="hint">${noPath
        ? "Want the 2-minute guide to what I'm building anyway? Drop your email and I'll send it over — nothing else, promise."
        : "I'll email you a short guide on what I'm building — plus your 3 free months. That's all, no spam."}</p>
      <div class="field"><label for="cName">Name</label><input type="text" id="cName" value="${answers.name||""}" autocomplete="name"></div>
      <div class="field"><label for="cContact">Email</label><input type="text" id="cContact" value="${answers.contact||""}" inputmode="email" autocomplete="email" placeholder="you@example.com">
      <div id="emailErr" style="display:none;color:#B4231F;font-size:13px;margin-top:5px">That email doesn't look right — mind checking it?</div></div>
      <p class="fine">Used only for the guide${noPath ? "" : " and your early-access invite"}. Never shared.</p>
      <div class="nav">
        <button class="btn ghost" onclick="back()">Back</button>
        <button class="btn primary" onclick="saveContact()">${noPath ? "Send me the guide" : "Send my answers"}</button>
      </div>`;
  }

  if (s.type === "done"){
    const saidNo = answers.interest === "no";
    html += `<div class="thanks">
      <h1>Got it — thank you 🙏</h1>
      <p>${saidNo
        ? "Your answers help me build something tutors actually need. Appreciate you."
        : "You're on the early-access list — and I'll email you personally soon."}</p>
      <div style="margin-top:16px;padding:16px;border:2px dashed var(--marker);border-radius:10px;background:#F0FAF7;text-align:center">
        <div style="font-size:14px;color:var(--ink);margin-bottom:10px">${saidNo
          ? "The 2-minute guide to what I'm building — in case you're curious. Something extra at the end. 😉"
          : "Here's the 2-minute guide to what you just helped shape — your <strong>3-months-free code is at the end</strong>."}</div>
        <a class="btn primary" style="display:inline-block;text-decoration:none" href="${PDF_URL}" target="_blank" rel="noopener">Open the guide</a>
      </div>
      <p class="fine" id="waFallbackNote"></p>
    </div>`;
  }

  html += "</div>";
  stage.innerHTML = html;
  window.scrollTo({top:0});
}

function navButtons(nextDisabled, isOptional){
  return `<div class="nav">
    ${stepIndex>0?'<button class="btn ghost" onclick="back()">Back</button>':""}
    <button class="btn primary" id="nextBtn" ${nextDisabled?"disabled":""} onclick="${isOptional?"saveText()":"next()"}">
      ${isOptional?"Continue":"Next"}</button>
  </div>`;
}

function pick(id, type, i, val){
  const s = steps[stepIndex];
  const value = val || (s.opts ? s.opts[i] : val);
  if (type === "multi"){
    answers[id] = answers[id] || [];
    const idx = answers[id].indexOf(value);
    idx >= 0 ? answers[id].splice(idx,1) : answers[id].push(value);
  } else {
    answers[id] = value;
  }
  render();
  if (type === "single") setTimeout(next, 260); // let the highlighter swipe land
}

function saveText(){
  answers.open = document.getElementById("freeText").value.trim();
  next();
}
function saveContact(){
  answers.name = document.getElementById("cName").value.trim();
  answers.contact = document.getElementById("cContact").value.trim();
  const err = document.getElementById("emailErr");
  if (answers.contact && !/^\S+@\S+\.\S+$/.test(answers.contact)){
    if (err) err.style.display = "block";
    return; // stay on this screen until the email looks valid
  }
  if (err) err.style.display = "none";
  submit();
}
function next(){ stepIndex++; render(); }
function back(){ stepIndex--; render(); }

function compileText(){
  return [
    "📋 Tutor survey response",
    "Teaches: " + (answers.role||"-"),
    "Students: " + (answers.count||"-"),
    "Admin time goes to: " + ((answers.chores||[]).join(", ")||"-"),
    "Tracks payments via: " + (answers.tracking||"-"),
    "Lost money: " + (answers.lost||"-"),
    "One chore to remove: " + (answers.one_wish||"-"),
    "Open comment: " + (answers.open||"-"),
    "Interested in app: " + (answers.interest||"-"),
    "Name: " + (answers.name||"-"),
    "Contact: " + (answers.contact||"-")
  ].join("\n");
}

let submitted = false;

async function submit(){
  stepIndex = steps.findIndex(s=>s.id==="done");
  render();
  const note = document.getElementById("waFallbackNote");
  // Guard: don't insert twice from the same run or the same device
  let alreadyDone = false;
  try { alreadyDone = !!localStorage.getItem("tutorSurveyDone"); } catch(e){}
  if (submitted || alreadyDone) return;
  submitted = true;
  if (SUPABASE_URL && SUPABASE_ANON_KEY){
    try{
      const res = await fetch(SUPABASE_URL + "/rest/v1/survey_responses",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ answers: answers, email: answers.contact || null, source: new URLSearchParams(location.search).get("src") || "direct" })
      });
      if (!res.ok) throw new Error("insert failed: " + res.status);
      try { localStorage.setItem("tutorSurveyDone","1"); } catch(e){}
    }catch(e){
      submitted = false; // allow retry if saving failed
      if (WHATSAPP_NUMBER){
        if (note) note.textContent = "Hmm, saving didn't go through — one more tap and WhatsApp opens with your answers ready to send.";
        openWhatsApp();
      } else if (note){
        note.textContent = "Saving didn't go through — mind trying again in a moment?";
      }
    }
  } else if (WHATSAPP_NUMBER){
    if (note) note.textContent = "One more tap — WhatsApp will open with your answers ready to send.";
    openWhatsApp();
  }
}

function openWhatsApp(){
  if (!WHATSAPP_NUMBER) return;
  const url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(compileText());
  window.open(url, "_blank");
}

render();
</script>
</body>
</html>
